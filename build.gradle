apply plugin: 'com.android.application'

android {
    compileSdkVersion 26
    defaultConfig {
        applicationId "com.ichangemycity.swachhbharatengineer"
        minSdkVersion 14
        multiDexEnabled true
        targetSdkVersion 26
        versionCode 20
        versionName "3.6.4"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:design:26.1.0'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    testImplementation 'junit:junit:4.12'
    compile 'com.android.support:cardview-v7:26.+'
    compile 'com.android.support:design:26.+'
    compile 'com.android.support:multidex:1.0.2'
    compile 'com.google.android.gms:play-services:11.0.4'
    compile 'com.pnikosis:materialish-progress:1.7'
    compile 'com.github.bumptech.glide:glide:4.0.0'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
    compile project(path: ':permission_manager')
    implementation project(':circleimageview')
    implementation project(':easyrecyclerview')
    implementation project(':otpview')
    implementation project(':RippleEffectLibrary')
    implementation project(':secureprefs')
    implementation project(':shoot-lib')
    implementation project(':volley-master')
    implementation project(':toasty')
    implementation project(':multispinner')
    implementation project(':permission_manager')
    implementation 'com.jakewharton:butterknife:8.8.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.8.1'
}

allprojects {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
    repositories {
        maven {
            url 'https://maven.google.com'
        }
    }
}